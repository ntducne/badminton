<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#16a34a" />
    <title>HelloYou is under maintenance</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f8faf5;
        color: #292524;
      }

      * {
        box-sizing: border-box;
      }

      body {
        position: relative;
        overflow: hidden;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 15%, #dcfce7 0, transparent 35%),
          radial-gradient(circle at 85% 85%, #bbf7d0 0, transparent 30%),
          #f8faf5;
      }

      body::before,
      body::after {
        position: fixed;
        z-index: 0;
        width: min(42vw, 420px);
        aspect-ratio: 1;
        content: "";
        border-radius: 50%;
        filter: blur(2px);
        opacity: 0.38;
        pointer-events: none;
      }

      body::before {
        top: -18%;
        left: -10%;
        background: radial-gradient(circle, #86efac, transparent 68%);
        animation: drift-one 12s ease-in-out infinite alternate;
      }

      body::after {
        right: -12%;
        bottom: -22%;
        background: radial-gradient(circle, #4ade80, transparent 68%);
        animation: drift-two 15s ease-in-out infinite alternate;
      }

      main {
        position: relative;
        z-index: 1;
        width: min(100%, 620px);
        padding: clamp(32px, 7vw, 64px);
        text-align: center;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #bbf7d0;
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(22, 101, 52, 0.12);
        backdrop-filter: blur(12px);
        animation: card-in 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .language-switcher {
        position: absolute;
        top: 18px;
        right: 18px;
        display: flex;
        gap: 3px;
        padding: 4px;
        background: #f0fdf4;
        border: 1px solid #dcfce7;
        border-radius: 999px;
      }

      .language-switcher button {
        padding: 6px 10px;
        color: #64748b;
        background: transparent;
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-size: 12px;
        font-weight: 750;
        cursor: pointer;
        transition: color 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      .language-switcher button:hover {
        color: #166534;
      }

      .language-switcher button[aria-pressed="true"] {
        color: white;
        background: #16a34a;
        box-shadow: 0 3px 10px rgba(22, 163, 74, 0.22);
      }

      .language-switcher button:focus-visible {
        outline: 3px solid rgba(22, 163, 74, 0.25);
        outline-offset: 2px;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 32px;
        color: #16a34a;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .logo-mark {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 14px;
        color: white;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        box-shadow: 0 8px 20px rgba(22, 163, 74, 0.25);
        animation: logo-float 3s ease-in-out infinite;
      }

      .translated-content {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
        transition:
          opacity 180ms ease,
          transform 260ms cubic-bezier(0.22, 1, 0.36, 1),
          filter 180ms ease;
      }

      .translated-content.is-changing {
        opacity: 0;
        transform: translateY(8px);
        filter: blur(3px);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(30px, 6vw, 46px);
        line-height: 1.1;
        letter-spacing: -0.045em;
      }

      p {
        margin: 0 auto;
        max-width: 470px;
        color: #78716c;
        font-size: 17px;
        line-height: 1.7;
      }

      .loader {
        display: flex;
        justify-content: center;
        gap: 7px;
        margin-top: 24px;
      }

      .loader span {
        width: 8px;
        height: 8px;
        background: #16a34a;
        border-radius: 50%;
        animation: bounce 1.3s ease-in-out infinite;
      }

      .loader span:nth-child(2) {
        animation-delay: 160ms;
      }

      .loader span:nth-child(3) {
        animation-delay: 320ms;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin-top: 30px;
        padding: 10px 16px;
        color: #166534;
        background: #f8faf5;
        border: 1px solid #bbf7d0;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 650;
      }

      .status::before {
        width: 9px;
        height: 9px;
        content: "";
        background: #16a34a;
        border-radius: 50%;
        box-shadow: 0 0 0 5px #dcfce7;
        animation: status-pulse 1.8s ease-out infinite;
      }

      footer {
        margin-top: 36px;
        color: #a8a29e;
        font-size: 13px;
      }

      @keyframes card-in {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes logo-float {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }
        50% {
          transform: translateY(-7px) rotate(2deg);
        }
      }

      @keyframes bounce {
        0%,
        60%,
        100% {
          opacity: 0.35;
          transform: translateY(0) scale(0.8);
        }
        30% {
          opacity: 1;
          transform: translateY(-7px) scale(1);
        }
      }

      @keyframes status-pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.38);
        }
        70%,
        100% {
          box-shadow: 0 0 0 8px rgba(22, 163, 74, 0);
        }
      }

      @keyframes drift-one {
        to {
          transform: translate(12vw, 10vh) scale(1.18);
        }
      }

      @keyframes drift-two {
        to {
          transform: translate(-10vw, -8vh) scale(1.12);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <nav class="language-switcher" aria-label="Language">
        <button type="button" data-lang="vi" aria-pressed="false">VI</button>
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
      </nav>

      <div class="logo" aria-label="HelloYou">
        <span class="logo-mark" aria-hidden="true">H</span>
        <span>HelloYou</span>
      </div>

      <div class="translated-content">
        <h1 data-i18n="heading">We're making things better</h1>
        <p data-i18n="description">
          We're carrying out a few upgrades to improve your experience. Please
          check back in a few minutes.
        </p>

        <div class="loader" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="status" data-i18n="status">
          We'll be back online shortly
        </div>
        <footer data-i18n="footer">
          Thank you for your patience and for being with HelloYou.
        </footer>
      </div>
    </main>

    <script>
      (() => {
        const translations = {
          vi: {
            title: "HelloYou đang bảo trì",
            heading: "Website đang được bảo trì",
            description:
              "Chúng tôi đang thực hiện một số nâng cấp để mang đến trải nghiệm tốt hơn. Vui lòng quay lại sau ít phút.",
            status: "Hệ thống sẽ sớm hoạt động trở lại",
            footer: "Cảm ơn bạn đã kiên nhẫn và đồng hành cùng HelloYou.",
          },
          en: {
            title: "HelloYou is under maintenance",
            heading: "We're making things better",
            description:
              "We're carrying out a few upgrades to improve your experience. Please check back in a few minutes.",
            status: "We'll be back online shortly",
            footer: "Thank you for your patience and for being with HelloYou.",
          },
        };

        const buttons = document.querySelectorAll("[data-lang]");
        const fields = document.querySelectorAll("[data-i18n]");
        const content = document.querySelector(".translated-content");
        let activeLanguage = "en";
        let transitionTimer;

        const updateContent = (language) => {
          const lang = translations[language] ? language : "en";
          const copy = translations[lang];

          activeLanguage = lang;
          document.documentElement.lang = lang;
          document.title = copy.title;
          fields.forEach((element) => {
            element.textContent = copy[element.dataset.i18n];
          });
          buttons.forEach((button) => {
            button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
          });

          try {
            localStorage.setItem("helloyou-maintenance-language-v2", lang);
          } catch (_) {}
        };

        const applyLanguage = (language, animate = true) => {
          const lang = translations[language] ? language : "en";
          window.clearTimeout(transitionTimer);

          if (lang === activeLanguage && animate) {
            content.classList.remove("is-changing");
            buttons.forEach((button) => {
              button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
            });
            return;
          }

          buttons.forEach((button) => {
            button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
          });

          if (!animate || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            updateContent(lang);
            return;
          }

          content.classList.add("is-changing");
          transitionTimer = window.setTimeout(() => {
            updateContent(lang);
            requestAnimationFrame(() => content.classList.remove("is-changing"));
          }, 180);
        };

        let savedLanguage;
        try {
          savedLanguage = localStorage.getItem("helloyou-maintenance-language-v2");
        } catch (_) {}

        applyLanguage(savedLanguage || "en", false);
        buttons.forEach((button) => {
          button.addEventListener("click", () => applyLanguage(button.dataset.lang));
        });
      })();
    </script>
  </body>
</html>
