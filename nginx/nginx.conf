# =========================
# HTTP -> HTTPS
# =========================
server {
    listen 80;
    listen [::]:80;

    server_name badminton.helloyouu.site;

    return 301 https://$host$request_uri;
}


# =========================
# badminton
# =========================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name badminton.helloyouu.site;

    ssl_certificate /etc/letsencrypt/live/helloyouu.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/helloyouu.site/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


    # =========================
    # Security headers
    # =========================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # =========================
    # Gzip
    # =========================
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;


    # =========================
    # Proxy buffers
    # =========================
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;


    # =========================
    # Maintenance page
    # =========================
    # Preserve application errors (especially API JSON responses).
    # Nginx-generated gateway failures still use the maintenance page below.
    proxy_intercept_errors off;

    error_page 502 503 504 =503 /maintenance.html;

    location = /maintenance.html {
        internal;

        root /var/www/badminton/scripts/nginx;
    }


    # =========================
    # Next.js
    # =========================
    location / {
        proxy_pass http://127.0.0.1:3102;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }


    # =========================
    # Favicon
    # =========================
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3102;

        proxy_set_header Host $host;

        log_not_found off;
        access_log off;
    }


    # =========================
    # Block hidden files
    # =========================
    location ~ /\.(?!well-known) {
        deny all;
    }
}
